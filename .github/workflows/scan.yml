name: security dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - movetech-magalu
          - api-vendas-
          - juiceshop
    steps:
      - name: escanear ${{ matrix.repo }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'repo'
          scan-ref: 'https://github.com/${{ github.repository_owner }}/${{ matrix.repo }}'
          scanners: 'vuln'
          format: 'table'
          exit-code: '0'