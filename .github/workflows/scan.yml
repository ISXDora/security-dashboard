name: security dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.lista.outputs.repos }}
    steps:
      - name: montar lista
        id: lista
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repos=$(gh repo list ${{ github.repository_owner }} \
            --limit 200 --no-archived --visibility public --json name | jq -c '[.[].name]')

          echo "$repos"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  scan:
    needs: listar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.listar.outputs.repos) }}
    steps:
      - name: escanear ${{ matrix.repo }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'repo'
          scan-ref: 'https://github.com/${{ github.repository_owner }}/${{ matrix.repo }}'
          scanners: 'vuln'
          format: 'json'
          output: 'resultado.json'
          exit-code: '0'

      - name: explorar o json
        run: |
          echo "=== camada 1: quais Targets ==="
          jq '.Results[]?.Target' resultado.json

          echo "=== camada 2: total de vulnerabilidades ==="
          jq '[.Results[]?.Vulnerabilities[]?] | length' resultado.json

          echo "=== camada 3: lista de severidades ==="
          jq '[.Results[]?.Vulnerabilities[]?.Severity]' resultado.json
      - name: contar por severidade
        run: |
          jq -c '{repo: "${{ matrix.repo }}"}
                 + ([.Results[]?.Vulnerabilities[]?.Severity]
                    | group_by(.)
                    | map({(.[0]): length})
                    | add // {})' resultado.json | tee contagem.json

      - name: salvar
        uses: actions/upload-artifact@v4
        with:
          name: contagem-${{ matrix.repo }}
          path: contagem.json
  agregar:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: baixar o proprio repo
        uses: actions/checkout@v7

      - name: baixar as contagens
        uses: actions/download-artifact@v4
        with:
          path: contagens

      - name: juntar
        run: |
          cat contagens/*/contagem.json | jq -s '{
            generated_at: (now | todate),
            owner: "${{ github.repository_owner }}",
            totals: {
              repos:    length,
              critical: (map(.CRITICAL // 0) | add),
              high:     (map(.HIGH     // 0) | add),
              medium:   (map(.MEDIUM   // 0) | add),
              low:      (map(.LOW      // 0) | add)
            },
            repos: .
          }' | tee summary.json

      - name: gerar o svg
        run: python3 gerar_svg.py summary.json dashboard.svg

      - name: commitar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add summary.json dashboard.svg

          if git diff --staged --quiet; then
            echo "nada mudou"
            exit 0
          fi

          git commit -m "chore: update security dashboard [skip ci]"
          git push