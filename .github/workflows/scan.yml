name: security dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.lista.outputs.repos }}
    steps:
      - name: montar lista
        id: lista
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repos=$(gh repo list ${{ github.repository_owner }} \
            --limit 200 --no-archived --json name | jq -c '[.[].name]')

          echo "$repos"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  scan:
    needs: listar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.listar.outputs.repos) }}
    steps:
      - name: escanear ${{ matrix.repo }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'repo'
          scan-ref: 'https://github.com/${{ github.repository_owner }}/${{ matrix.repo }}'
          scanners: 'vuln'
          format: 'json'
          output: 'resultado.json'
          exit-code: '0'

      - name: explorar o json
        run: |
          echo "=== bytes ==="
          wc -c resultado.json

          echo "=== chaves do topo ==="
          jq 'keys' resultado.json

          echo "=== quantos Results ==="
          jq '.Results | length' resultado.json

          echo "=== uma vulnerabilidade inteira ==="
          jq '.Results[0].Vulnerabilities[0]' resultado.json